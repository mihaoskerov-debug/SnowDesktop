# Собирает SnowDesktop для Windows (.exe) и macOS (.app) на серверах GitHub
# и выкладывает файлы в раздел Releases.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip pyinstaller PySide6 hidapi anthropic winrt-runtime winrt-Windows.Foundation winrt-Windows.Foundation.Collections winrt-Windows.Media.Control winrt-Windows.Storage.Streams
      - name: Icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python make_icon.py
      - name: Build exe
        run: python -m PyInstaller --noconsole --onefile --name SnowDesktop --icon snow.ico snow.pyw
      - name: Build widgets exe
        run: python -m PyInstaller --noconsole --onefile --name SnowWidgets --hidden-import hid --collect-submodules winrt --collect-submodules anthropic --hidden-import PySide6.QtWebEngineWidgets --hidden-import PySide6.QtWebEngineCore --icon snow.ico widgets.pyw
      - name: Rename
        run: |
          Copy-Item dist\SnowDesktop.exe SnowDesktop-windows.exe
          Copy-Item dist\SnowWidgets.exe SnowWidgets-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SnowDesktop-windows
          path: |
            SnowDesktop-windows.exe
            SnowWidgets-windows.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build app
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash build_app_mac.sh
      - name: Zip app
        run: ditto -c -k --keepParent dist/SnowDesktop.app SnowDesktop-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SnowDesktop-mac
          path: SnowDesktop-mac.zip

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Сборка {0}', github.run_number) }}
          files: |
            SnowDesktop-windows.exe
            SnowWidgets-windows.exe
            SnowDesktop-mac.zip
          body: |
            **Windows:** скачай `SnowDesktop-windows.exe` и запусти. Если Windows предупредит — «Подробнее» → «Выполнить в любом случае».

            **Виджеты для Windows:** `SnowWidgets-windows.exe` - погода, Яндекс Музыка, Claude, Discord, заряд мыши, слайд-шоу фото, календарь, часы, система.

            **macOS (Apple Silicon):** скачай `SnowDesktop-mac.zip`, распакуй, перетащи `SnowDesktop.app` в «Программы».
            При первом запуске: «Системные настройки» → «Конфиденциальность и безопасность» → «Всё равно открыть».
